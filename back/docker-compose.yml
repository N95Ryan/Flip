services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flip
      POSTGRES_PASSWORD: flip
      POSTGRES_DB: flip
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flip -d flip"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    entrypoint: ["/migrate"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://flip:flip@db:5432/flip?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATABASE_URL: postgres://flip:flip@db:5432/flip?sslmode=disable
      AVATAR_UPLOAD_DIR: /tmp/avatars
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata: